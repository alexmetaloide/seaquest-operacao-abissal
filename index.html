<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061729"><meta name="description" content="Mergulhe, resgate a tripulação e sobreviva às profundezas. Uma homenagem jogável aos arcades clássicos.">
<title>SEAQUEST — Operação Abissal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--ink:#eefaff;--muted:#82a9b9;--cyan:#63f5e6;--blue:#2789d5;--line:rgba(128,210,230,.18)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#174563 0,#091d32 42%,#061321 80%);color:var(--ink);font-family:'Space Grotesk',sans-serif;display:grid;place-items:center;padding:32px 18px 26px}.shell{width:min(1100px,100%)}.topline{display:flex;align-items:center;justify-content:space-between;margin:0 1px 14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:1px solid #4debd7;border-radius:50%;display:grid;place-items:center;color:var(--cyan);box-shadow:0 0 23px #36ddc833}.logo svg{width:23px}.eyebrow,.mono{font-family:'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase}.eyebrow{font-size:10px;color:var(--cyan);margin:0 0 3px}.brand h1{font-size:16px;letter-spacing:.12em;margin:0;font-weight:700}.topmeta{font:10px 'DM Mono',monospace;color:#78a0b4;letter-spacing:.1em}.gameframe{border:1px solid #294b60;border-radius:10px;background:#071a2a;padding:9px;box-shadow:0 25px 80px #0008,0 0 60px #0a487322;position:relative}.gameframe:before{content:'';position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(135deg,#5cf5dd16,transparent 35%,transparent 72%,#38a8ff0b)}.screen{position:relative;overflow:hidden;border-radius:5px;background:#061c32;aspect-ratio:16/9}.screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.screen:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#b9faff08 4px);mix-blend-mode:screen}.bottomline{display:flex;justify-content:space-between;align-items:center;margin:13px 4px 0;gap:14px}.legend{font:10px 'DM Mono',monospace;color:#89aebd;letter-spacing:.035em}.legend b{color:#dffcff;font-weight:500}.pill{color:var(--cyan);border:1px solid #54e9d344;background:#55eddd0b;border-radius:999px;padding:7px 11px;font:9px 'DM Mono',monospace;letter-spacing:.1em;white-space:nowrap}.footer{display:flex;justify-content:space-between;margin:23px 4px 0;color:#668799;font:9px 'DM Mono',monospace;letter-spacing:.08em}.footer a{color:#8baebe;text-decoration:none}.mobile-controls{display:none;justify-content:space-between;align-items:center;padding:12px 8px 3px}.pad{display:grid;grid-template-columns:38px 38px 38px;grid-template-rows:35px 35px;gap:3px}.pad button,.fire{border:1px solid #397289;background:#0c2940;color:#a4e8ef;border-radius:7px;font-size:17px;touch-action:none}.pad button[data-dir=up]{grid-column:2}.pad button[data-dir=left]{grid-row:2;grid-column:1}.pad button[data-dir=down]{grid-row:2;grid-column:2}.pad button[data-dir=right]{grid-row:2;grid-column:3}.fire{height:73px;width:73px;border-radius:50%;font:10px 'DM Mono',monospace;letter-spacing:.1em;color:var(--cyan);border-color:#3edac0;box-shadow:inset 0 0 20px #20d4c022}.pad button:active,.fire:active{background:#17607a}@media(max-width:650px){body{padding:17px 10px}.topmeta{display:none}.gameframe{padding:5px}.bottomline{align-items:flex-start}.legend{font-size:8px;line-height:1.7}.pill{font-size:8px;padding:6px 8px}.mobile-controls{display:flex}.footer{font-size:8px;margin-top:15px}.screen{aspect-ratio:4/3}}@media(min-width:651px){.mobile-controls{display:none}}
</style>
</head>
<body><main class="shell">
<header class="topline"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 13c5-8 13-8 18 0-5 8-13 8-18 0Z" stroke="currentColor" stroke-width="1.5"/><path d="M7 13h10M12 9v8" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="13" r="2" fill="currentColor"/></svg></div><div><p class="eyebrow">Arcade submarino · 1985 → agora</p><h1>SEAQUEST <span style="color:#63f5e6">/</span> OPERAÇÃO ABISSAL</h1></div></div><div class="topmeta">MISSÃO 07 · OCEANO PACÍFICO · 32°S</div></header>
<section class="gameframe" aria-label="Jogo Seaquest"><div class="screen"><canvas id="game" width="960" height="540" aria-label="Campo de jogo submarino"></canvas></div><div class="mobile-controls" aria-label="Controles de toque"><div class="pad"><button data-dir="up" aria-label="Subir">↑</button><button data-dir="left" aria-label="Esquerda">←</button><button data-dir="down" aria-label="Descer">↓</button><button data-dir="right" aria-label="Direita">→</button></div><button class="fire" aria-label="Disparar torpedos">DISPARAR</button></div></section>
<div class="bottomline"><div class="legend"><b>↑ ↓ ← →</b> ou <b>W A S D</b> MOVER &nbsp;·&nbsp; <b>ESPAÇO</b> DISPARAR &nbsp;·&nbsp; <b>ENTER</b> INICIAR</div><div class="pill">RESGATE 6 MERGULHADORES → SUBA À SUPERFÍCIE</div></div>
<footer class="footer"><span>UMA HOMENAGEM AOS ARCADES QUE NOS FIZERAM MERGULHAR.</span><a href="#" id="soundToggle">♪ SOM: LIGADO</a></footer>
</main>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d');const W=960,H=540,keys=new Set();let mode='title',score=0,best=+(localStorage.getItem('seaquest-best')||0),lives=3,crew=0,air=100,level=1,frame=0,sub,shots=[],foes=[],divers=[],bubbles=[],particles=[],sound=true,audio,surfaceNotice=0,surfacePoints=0;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function beep(f=420,d=.07,type='square',vol=.025){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function start(){mode='play';score=0;lives=3;crew=0;air=100;level=1;sub={x:160,y:270,hit:0};shots=[];foes=[];divers=[];particles=[];spawnCrew();beep(500,.12)}function spawnCrew(){divers=[];for(let i=0;i<6;i++)divers.push({x:rnd(350,900),y:rnd(205,485),vy:rnd(-.22,.22),rescued:false})}
function addEnemy(){const types=['shark','shark','sub'];const type=types[Math.floor(rnd(0,types.length))];foes.push({x:rnd(990,1140),y:rnd(205,480),vx:-rnd(1.35,2.05)-level*.1,phase:rnd(0,6.28),type,hp:1})}
function fire(){if(mode!=='play'){if(mode==='title'||mode==='over')start();return}if(!sub.cool){shots.push({x:sub.x+39,y:sub.y+10,vx:7.5});sub.cool=17;beep(290,.055,'sawtooth',.018)}}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key==='Enter'&&(mode==='title'||mode==='over'))start();if(e.key===' '&&!e.repeat)fire()});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('.pad button').forEach(b=>{const d=b.dataset.dir,k={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'}[d];b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>keys.delete(k)))});document.querySelector('.fire').addEventListener('pointerdown',e=>{e.preventDefault();fire()});document.querySelector('#soundToggle').onclick=e=>{e.preventDefault();sound=!sound;e.currentTarget.textContent=`♪ SOM: ${sound?'LIGADO':'DESLIGADO'}`;if(sound)beep(560)};
function hit(){if(sub.hit>0)return;lives--;sub.hit=100;air=100;crew=0;spawnCrew();beep(100,.35,'sawtooth',.05);for(let i=0;i<20;i++)particles.push({x:sub.x+20,y:sub.y+12,vx:rnd(-3,3),vy:rnd(-3,3),life:35,color:'#ff875e'});if(lives<=0){mode='over';best=Math.max(best,score);localStorage.setItem('seaquest-best',best)}}
function update(){frame++;bubbles.push({x:rnd(25,940),y:550,r:rnd(1,3),v:rnd(.65,1.9),a:rnd(.15,.48)});bubbles=bubbles.filter(b=>b.y>-5);bubbles.forEach(b=>b.y-=b.v);if(mode!=='play')return;
let dx=0,dy=0;if(keys.has('arrowleft')||keys.has('a'))dx--;if(keys.has('arrowright')||keys.has('d'))dx++;if(keys.has('arrowup')||keys.has('w'))dy--;if(keys.has('arrowdown')||keys.has('s'))dy++;sub.x=clamp(sub.x+dx*2.65,35,910);sub.y=clamp(sub.y+dy*2.45,92,494);if(sub.cool>0)sub.cool--;if(sub.hit>0)sub.hit--;air-=.023;if(air<=0)hit();if(sub.y<150){if(crew){surfacePoints=crew*500;score+=surfacePoints;level=1+Math.floor(score/8000);surfaceNotice=150;beep(690,.15,'triangle');crew=0;spawnCrew()}air=Math.min(100,air+.8)}if(surfaceNotice>0)surfaceNotice--;
if(frame%100===0)addEnemy();shots.forEach(s=>s.x+=s.vx);shots=shots.filter(s=>s.x<990);for(const f of foes){f.x+=f.vx;f.y+=Math.sin(frame*.04+f.phase)*.38}foes=foes.filter(f=>f.x>-80);
for(let i=foes.length-1;i>=0;i--){const f=foes[i];for(let j=shots.length-1;j>=0;j--){let s=shots[j];if(Math.abs(s.x-f.x)<32&&Math.abs(s.y-f.y)<22){shots.splice(j,1);foes.splice(i,1);score+=f.type==='shark'?300:500;beep(760,.06,'triangle');for(let n=0;n<7;n++)particles.push({x:f.x,y:f.y,vx:rnd(-2,2),vy:rnd(-2,2),life:22,color:'#73ffe2'});break}}if(foes[i]&&Math.abs(f.x-sub.x)<34&&Math.abs(f.y-sub.y)<22)hit()}
for(const d of divers){if(!d.rescued){d.x+=Math.sin(frame*.02+d.y)*.18;d.y+=d.vy;if(d.y<200||d.y>495)d.vy*=-1;if(Math.abs(d.x-sub.x)<32&&Math.abs(d.y-sub.y)<30&&crew<6){d.rescued=true;crew++;score+=500;beep(600+crew*40,.09,'triangle')}}}
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});particles=particles.filter(p=>p.life>0);if(divers.every(d=>d.rescued)&&crew===6){/* Return to surface to bank the crew */}
}
function rounded(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function text(t,x,y,size,color='#eaffff',align='left',font='DM Mono'){ctx.fillStyle=color;ctx.font=`${size}px '${font}', monospace`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071c34');g.addColorStop(.25,'#0b3552');g.addColorStop(.58,'#075070');g.addColorStop(1,'#032a47');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#a4efff';for(let i=0;i<45;i++){let x=(i*197+frame*.12*(i%3+1))%W,y=(i*83+frame*.35*(i%2+1))%H;ctx.globalAlpha=.15+(i%4)*.08;ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
for(let i=0;i<18;i++){let x=(i*64+20)%W;ctx.strokeStyle=i%2?'#0c675c44':'#20ae8260';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,H);for(let y=H;y>390;y-=18)ctx.lineTo(x+Math.sin(frame*.009+y*.04+i)*7,y);ctx.stroke()}
ctx.fillStyle='#56d7e833';ctx.fillRect(0,174,W,2);ctx.fillStyle='#b4ffff0c';ctx.fillRect(0,174,W,7);ctx.fillStyle='#d2faff';for(let i=0;i<30;i++){let x=(i*47+frame*.8)%W;ctx.globalAlpha=.25+Math.sin(frame*.03+i)*.13;ctx.fillRect(x,177,2,2)}ctx.globalAlpha=1;
bubbles.forEach(b=>{ctx.globalAlpha=b.a;ctx.strokeStyle='#b8f6ff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke()});ctx.globalAlpha=1;
ctx.globalAlpha=.045;for(let i=0;i<5;i++){ctx.fillStyle='#69eeef';ctx.beginPath();ctx.moveTo(i*235-40,0);ctx.lineTo(i*235+15,0);ctx.lineTo(i*235+125,185);ctx.lineTo(i*235+73,185);ctx.fill()}ctx.globalAlpha=1;
}
function submarine(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#083c52';ctx.beginPath();ctx.moveTo(-32,13);ctx.lineTo(-42,4);ctx.lineTo(-34,-4);ctx.lineTo(-13,-8);ctx.lineTo(-5,-18);ctx.lineTo(8,-18);ctx.lineTo(15,-8);ctx.lineTo(31,-4);ctx.lineTo(42,3);ctx.lineTo(33,13);ctx.closePath();ctx.fill();ctx.fillStyle='#50e9cd';ctx.fillRect(-27,12,54,4);ctx.fillStyle='#36bcaa';ctx.beginPath();ctx.ellipse(0,2,33,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c8ffff';ctx.fillRect(26,0,10,3);ctx.fillStyle='#8cf6eb';ctx.beginPath();ctx.ellipse(-6,-3,8,6,0,Math.PI,0);ctx.fill();ctx.fillStyle='#123f5b';ctx.fillRect(-5,-19,11,8);ctx.fillStyle='#ffbf58';ctx.fillRect(-39,2,5,4);ctx.restore()}
function shark(x,y){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.fillStyle='#8baebe';ctx.beginPath();ctx.moveTo(-27,0);ctx.lineTo(-45,-12);ctx.lineTo(-39,1);ctx.lineTo(-48,10);ctx.lineTo(-28,7);ctx.quadraticCurveTo(-8,20,17,7);ctx.lineTo(34,0);ctx.lineTo(15,-6);ctx.quadraticCurveTo(-4,-19,-24,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#406780';ctx.beginPath();ctx.moveTo(-6,-10);ctx.lineTo(1,-23);ctx.lineTo(8,-8);ctx.fill();ctx.fillStyle='#102b40';ctx.fillRect(20,-4,3,3);ctx.fillStyle='#c0d8dc';ctx.fillRect(-10,7,19,2);ctx.restore()}
function diver(x,y){ctx.fillStyle='#ffcb69';ctx.beginPath();ctx.arc(x,y-8,4,0,Math.PI*2);ctx.fill();rounded(x-4,y-4,8,11,3,'#ff7f59');ctx.strokeStyle='#d5faff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-2,y+5);ctx.lineTo(x-7,y+10);ctx.moveTo(x+2,y+5);ctx.lineTo(x+7,y+10);ctx.stroke();ctx.fillStyle='#8cf2dc';ctx.fillRect(x+3,y-2,5,2)}
function hud(){rounded(19,15,922,52,6,'#051728bb');ctx.strokeStyle='#64dece28';ctx.strokeRect(19.5,15.5,921,51);text('SCORE',38,36,10,'#7fa8b8');text(String(score).padStart(6,'0'),38,55,17,'#eaffff');text('BEST',195,36,10,'#7fa8b8');text(String(best).padStart(6,'0'),195,55,15,'#9ed3dc');text('MERGULHADORES',375,36,9,'#7fa8b8');for(let i=0;i<6;i++){ctx.globalAlpha=i<crew?1:.27;diver(488+i*19,51)}ctx.globalAlpha=1;text('AR',635,36,10,'#7fa8b8');rounded(660,27,118,11,5,'#174257');rounded(660,27,118*air/100,11,5,air<25?'#ff725f':'#53e9d4');text('OXIGÊNIO',660,55,8,'#86aeba');text('VIDAS',805,36,9,'#7fa8b8');for(let i=0;i<lives;i++){ctx.fillStyle='#69f0db';ctx.beginPath();ctx.arc(866+i*20,46,5,0,Math.PI*2);ctx.fill();ctx.fillRect(861+i*20,46,10,7)}text(`NÍVEL ${level}`,920,55,9,'#9ed3dc','right')}
function overlay(title,sub,cta){ctx.fillStyle='#03101cb5';ctx.fillRect(0,0,W,H);ctx.textAlign='center';text('◈  DEEP SEA DIVISION  ◈',W/2,180,12,'#68f3dc');ctx.font="700 62px 'Space Grotesk',sans-serif";ctx.fillStyle='#edffff';ctx.shadowColor='#64f8e6';ctx.shadowBlur=22;ctx.fillText(title,W/2,263);ctx.shadowBlur=0;text(sub,W/2,303,15,'#aad0d9','center');rounded(W/2-132,340,264,46,5,'#4adbc7');ctx.font="500 13px 'DM Mono',monospace";ctx.fillStyle='#062034';ctx.fillText(cta,W/2,369);ctx.font="11px 'DM Mono',monospace";ctx.fillStyle='#7faab9';ctx.fillText('↑ ↓ ← →  MOVER     ·     ESPAÇO  DISPARAR',W/2,421);ctx.fillText('RESGATE A EQUIPE E VOLTE À SUPERFÍCIE PARA RECUPERÁ-LA',W/2,443);ctx.textAlign='left'}
function draw(){background();if(mode==='play'){for(const d of divers)if(!d.rescued)diver(d.x,d.y);foes.forEach(f=>f.type==='shark'?shark(f.x,f.y):submarine(f.x,f.y));shots.forEach(s=>{ctx.fillStyle='#c7fff5';ctx.shadowColor='#61ffee';ctx.shadowBlur=12;ctx.fillRect(s.x,s.y,15,3);ctx.shadowBlur=0});if(!(sub.hit&&Math.floor(frame/5)%2))submarine(sub.x,sub.y);particles.forEach(p=>{ctx.globalAlpha=p.life/35;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;hud();if(surfaceNotice>0)text('TRIPULAÇÃO RECUPERADA  +' + surfacePoints,W/2,157,13,'#63f5e6','center');else if(air<22)text('OXIGÊNIO CRÍTICO — SUBA!',W/2,160,12,'#ff9179','center')}
else if(mode==='title'){for(let i=0;i<4;i++)shark(775+i*120,280+i*61);submarine(220+Math.sin(frame*.03)*24,302);hud();overlay('SEAQUEST','AS PROFUNDEZAS ESPERAM POR VOCÊ','INICIAR MERGULHO  ·  ENTER')}
else{hud();overlay('FIM DE MERGULHO',`PONTUAÇÃO  ${String(score).padStart(6,'0')}     ·     MELHOR  ${String(best).padStart(6,'0')}`,'MERGULHAR DE NOVO  ·  ENTER')}}
function loop(){update();draw();requestAnimationFrame(loop)}
start();mode='title';loop();
})();
</script></body></html>
